name: Marketplace PR gate

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Run release gate
        run: bash scripts/release-gate.sh
